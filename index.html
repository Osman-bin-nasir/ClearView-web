<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary meta -->
    <title>ClearView — Watch what you want, not what they want.</title>
    <meta
      name="description"
      content="ClearView is one organisation with three apps: a protected browser, focused media, productivity and everyday tools on Android and iOS, and the same protection running in Chrome. It hides YouTube Shorts, Instagram Reels and ads, blocks explicit sites and searches, and keeps your feeds in your hands."
    />
    <meta name="theme-color" content="#00E0D2" />
    <!--
      No canonical link yet, on purpose: the site has no domain. Once it does,
      add one here pointing at the site's own root — NOT at a store listing.
      The page is the organisation's, and the listings are three of its links.
    -->

    <!-- Icons: the app mark on its white tile, generated by tools/make-logo.py -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClearView — Watch what you want, not what they want." />
    <meta
      property="og:description"
      content="Three apps, one organisation: Android, iOS and Chrome. Protection that holds, a quieter browser, an RSS-based media feed, and Quran reading that works offline."
    />
    <!--
      NOTE: as soon as the site has a domain, switch this to an absolute URL
      (crawlers ignore relative paths), e.g.
      https://your-domain.com/og.png — and make the canonical link above absolute too.
    -->
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClearView — Watch what you want, not what they want." />
    <meta
      name="twitter:description"
      content="Safer browsing, focused media, productivity and everyday tools — on Android, iOS and Chrome."
    />
    <meta name="twitter:image" content="./og.png" />

    <!-- Fonts: Montserrat for headings, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
